name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: freelance_agent_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d freelance_agent_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Django deploy checks
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ci-secret
          DEBUG: "false"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/freelance_agent_ci
          DATABASE_SSL_REQUIRE: "false"
          SECURE_SSL_REDIRECT: "false"
          ALLOWED_HOSTS: "localhost"
          CORS_ALLOWED_ORIGINS: "http://localhost:5173"
          CSRF_TRUSTED_ORIGINS: "http://localhost:5173"
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-secret
          DEBUG: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/freelance_agent_ci
          DATABASE_SSL_REQUIRE: "false"
      - name: Backend tests
        run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-secret
          DEBUG: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/freelance_agent_ci
          DATABASE_SSL_REQUIRE: "false"
      - name: Python compile check
        run: python -m compileall -q .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
