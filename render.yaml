services:
  - type: web
    name: ai-freelance-client-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/

  - type: worker
    name: ai-freelance-client-agent-discovery
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: python manage.py run_discovery_cycle --loop
