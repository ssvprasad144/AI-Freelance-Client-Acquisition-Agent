services:
  - type: web
    name: ai-freelance-client-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DISCOVERY_MODEL
        value: gpt-4o-mini
      - key: DISCOVERY_WORKER_INTERVAL
        value: "3600"
      - key: FOLLOWUP_WORKER_INTERVAL
        value: "60"
      - key: SECURE_SSL_REDIRECT
        value: "true"

  - type: worker
    name: ai-freelance-client-agent-discovery
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: python manage.py run_acquisition_cycle --loop
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DISCOVERY_MODEL
        value: gpt-4o-mini
      - key: DISCOVERY_WORKER_INTERVAL
        value: "3600"
      - key: FOLLOWUP_WORKER_INTERVAL
        value: "60"
      - key: SECURE_SSL_REDIRECT
        value: "true"

  - type: worker
    name: ai-freelance-client-agent-followups
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: python manage.py process_due_followups --loop
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DISCOVERY_MODEL
        value: gpt-4o-mini
      - key: DISCOVERY_WORKER_INTERVAL
        value: "3600"
      - key: FOLLOWUP_WORKER_INTERVAL
        value: "60"
      - key: SECURE_SSL_REDIRECT
        value: "true"

  - type: web
    name: ai-freelance-client-agent-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
